name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip pytest ruff build
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q
      - run: python -m compileall -q src
      - run: python -m build
