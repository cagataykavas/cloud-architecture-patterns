name: infrastructure-change-risk

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install ruff==0.16.9 pytest==9.1.1
      - run: >-
          ruff check --config "lint.isort.known-first-party=['tools']"
          tools/change_risk_audit.py tests/test_change_risk_audit.py
      - run: >-
          ruff format --check --isolated
          tools/change_risk_audit.py tests/test_change_risk_audit.py
      - run: python -m pytest -q tests/test_change_risk_audit.py
      - run: python -m compileall -q tools tests/test_change_risk_audit.py
