name: failover-readiness

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install ruff==0.12.11
      - run: python -m ruff check tools tests/test_failover_readiness.py
      - run: python -m ruff format --check tools tests/test_failover_readiness.py
      - run: python -m unittest -v tests.test_failover_readiness
      - run: python -m compileall -q tools tests/test_failover_readiness.py
